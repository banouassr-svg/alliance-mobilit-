  <circle cx="88" cy="88" r="5" fill="#0f172a" stroke="url(#gold)" stroke-width="1.5"/>
  <!-- Bordure -->
  <rect width="120" height="120" rx="24" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.6"/>
