<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="a-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f2744"/>
    </linearGradient>
    <linearGradient id="a-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d5a87"/>
      <stop offset="100%" style="stop-color:#4a7fb5"/>
    </linearGradient>
  </defs>
  <!-- Lettre A stylisée - jambe gauche (bleu foncé) -->
  <path d="M55 152 L100 38 L108 38 L153 152 L142 152 L132 125 L76 125 Z" fill="url(#a-dark)"/>
  <!-- Jambe droite du A (bleu clair) -->
  <path d="M108 38 L153 152 L163 152 L118 38 Z" fill="url(#a-light)"/>
  <!-- Barre horizontale du A -->
  <path d="M88 92 L132 92 L130 78 L90 78 Z" fill="url(#a-light)"/>
  <!-- Camion blanc - coffre avec bandes bleu/blanc/rouge (drapeau français) -->
  <rect x="115" y="72" width="50" height="42" rx="2" fill="white" stroke="#1e3a5f" stroke-width="0.5"/>
  <rect x="115" y="72" width="50" height="14" fill="#0055A4"/>
  <rect x="115" y="86" width="50" height="14" fill="white"/>
  <rect x="115" y="100" width="50" height="14" fill="#EF4135"/>
  <!-- Cabine du camion -->
  <path d="M102 98 L102 72 L115 72 L115 98 Z" fill="white" stroke="#1e3a5f" stroke-width="0.5"/>
  <rect x="105" y="78" width="6" height="3" rx="1" fill="#1e3a5f"/>
  <!-- Roues -->
  <circle cx="108" cy="115" r="7" fill="#2c2c2c"/>
  <circle cx="108" cy="115" r="3" fill="#555"/>
  <circle cx="155" cy="115" r="7" fill="#2c2c2c"/>
  <circle cx="155" cy="115" r="3" fill="#555"/>
  <!-- Texte Alliance Mobilité -->
  <text x="160" y="165" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#1e3a5f">Alliance Mobilité</text>
  <!-- Tagline -->
  <text x="160" y="185" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#4a5568">Plusieurs collaborateurs, une seule mission : votre sérénité.</text>
</svg>
