<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37"/>
      <stop offset="100%" style="stop-color:#F3D8B0"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A2D40"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Rounded background - bleu nuit -->
  <rect width="120" height="120" rx="20" fill="url(#darkGrad)"/>
  <!-- Truck container body -->
  <path d="M22 55 L22 75 L30 75 L30 88 L58 88 L58 75 L96 75 L96 55 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Truck cab -->
  <path d="M58 55 L58 88 L80 88 L92 75 L92 55 Z" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="2"/>
  <!-- Window -->
  <path d="M62 59 L76 59 L88 72 L62 72 Z" fill="url(#goldGrad)" opacity="0.5"/>
  <!-- Wheels -->
  <circle cx="40" cy="88" r="6" fill="#1A2D40" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="40" cy="88" r="2" fill="url(#goldGrad)"/>
  <circle cx="90" cy="88" r="6" fill="#1A2D40" stroke="url(#goldGrad)" stroke-width="2"/>
  <circle cx="90" cy="88" r="2" fill="url(#goldGrad)"/>
  <!-- Cartons -->
  <rect x="30" y="46" width="14" height="14" rx="2" fill="url(#goldGrad)"/>
  <rect x="46" y="43" width="16" height="16" rx="2" fill="url(#goldGrad)"/>
  <rect x="64" y="48" width="12" height="12" rx="2" fill="url(#goldGrad)" opacity="0.9"/>
  <!-- Bordure dorée -->
  <rect width="120" height="120" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
</svg>
